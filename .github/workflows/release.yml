name: release
# 打 tag（v*）自动构建三端安装包并挂到 GitHub Release：
#   macos-latest → .dmg（aarch64）
#   windows-latest → .exe（NSIS x64）
#   APK 不在 CI 构建：gen/android 不入库（本地签名管线），android job 已移除
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: android-actions/setup-android@v3
        if: runner.os == 'Linux'
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Build desktop bundles
        run: pnpm --filter @onethu/desktop exec tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onethu-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/**/*.dmg
            apps/desktop/src-tauri/target/**/*.exe
