name: release
# 打 tag（v*）自动构建三端安装包并挂到 GitHub Release：
#   macos-latest → .dmg（aarch64）
#   windows-latest → .exe（NSIS x64）
#   APK 不在 CI 构建：gen/android 不入库（本地签名管线），android job 已移除
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only_windows:
        description: "只跑 Windows job（日常验证 Windows 构建链用）"
        type: boolean
        default: false
      runner:
        description: "构建机：github-hosted（云，约 11 分钟）/ self-hosted（自己的 Windows 机，热缓存 1–3 分钟）"
        type: choice
        options: ["github-hosted", "self-hosted"]
        default: "github-hosted"
      no_bundle:
        description: "只出便携 exe（跳过 NSIS 安装包，迭代更快）"
        type: boolean
        default: false

jobs:
  desktop:
    # 手动触发可只跑 Windows（矩阵动态生成）；打 tag 正式链路恒为双平台
    strategy:
      fail-fast: false
      matrix: ${{ (github.event_name == 'workflow_dispatch' && inputs.only_windows)
        && fromJSON('{"include":[{"os":"windows-latest","args":""}]}')
        || fromJSON('{"include":[{"os":"macos-latest","args":"--target aarch64-apple-darwin"},{"os":"windows-latest","args":""}]}') }}
    # 自建 runner（自己的 Windows 机）：热 target 目录增量编译，比云上快一个数量级。
    # 标签用 [self-hosted, Windows]（GitHub 给自建 runner 的默认标签）。
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted')
      && fromJSON('["self-hosted","Windows"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # 自建 runner 不 clean：保住 target/ 与 node_modules 的热缓存（clean 会 git clean -ffdx）
          clean: ${{ !(github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # sccache：跨运行的编译结果缓存（Windows 上依赖编译是主要开销）
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: swatinem/rust-cache@v2
        with:
          # sidecar 是独立 cargo 工程（target 在自己目录下），不列出则每轮
          # 冷编整个依赖树——Windows runner 实测白烧 5–8 分钟
          workspaces: |
            apps/desktop/src-tauri
            plugins/OneTHU-Harness
      - uses: android-actions/setup-android@v3
        if: runner.os == 'Linux'
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      # 工作区库里 main 指向 dist 的必须先构建（dist 不入库）：
      #   Windows/macOS 的 tauri build 在 beforeBuildCommand 阶段会因
      #   「Failed to resolve entry for package "@onethu/info-lib"」直接失败
      #   （2026-09-21 windows-latest 实录）。本机不复发是因为 dist 已存在。
      # 规则：任一 packages/* 的 package.json main 指向 dist 时，都要加进这一行。
      - name: Build workspace libraries
        run: pnpm --filter @onethu/info-lib build
      # sidecar 必须在目标平台现场构建（仓库不带任何架构的二进制；
      # 旧版 Windows 安装包曾打进 mac 的 Mach-O → 插件宿主拉起必死）
      - name: Build harness sidecar (host-native)
        run: pnpm --filter @onethu/desktop build:harness
      - name: Build desktop bundles
        run: pnpm --filter @onethu/desktop exec tauri build ${{ matrix.args }} ${{ (github.event_name == 'workflow_dispatch' && inputs.no_bundle) && '--no-bundle' || '' }}
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ""
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onethu-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/onethu.exe
            apps/desktop/src-tauri/target/**/*.dmg
