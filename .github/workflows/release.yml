name: release
# 打 tag（v*）自动构建三端安装包并挂到 GitHub Release：
#   macos-latest → .dmg（aarch64）
#   windows-latest → .exe（NSIS x64）
#   APK 不在 CI 构建：gen/android 不入库（本地签名管线），android job 已移除
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only_windows:
        description: "只跑 Windows job（日常验证 Windows 构建链用）"
        type: boolean
        default: false

jobs:
  desktop:
    # 手动触发可只跑 Windows（矩阵动态生成）；打 tag 正式链路恒为双平台
    strategy:
      fail-fast: false
      matrix: ${{ (github.event_name == 'workflow_dispatch' && inputs.only_windows)
        && fromJSON('{"include":[{"os":"windows-latest","args":""}]}')
        || fromJSON('{"include":[{"os":"macos-latest","args":"--target aarch64-apple-darwin"},{"os":"windows-latest","args":""}]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          # sidecar 是独立 cargo 工程（target 在自己目录下），不列出则每轮
          # 冷编整个依赖树——Windows runner 实测白烧 5–8 分钟
          workspaces: |
            apps/desktop/src-tauri
            plugins/OneTHU-Harness
      - uses: android-actions/setup-android@v3
        if: runner.os == 'Linux'
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      # sidecar 必须在目标平台现场构建（仓库不带任何架构的二进制；
      # 旧版 Windows 安装包曾打进 mac 的 Mach-O → 插件宿主拉起必死）
      - name: Build harness sidecar (host-native)
        run: pnpm --filter @onethu/desktop build:harness
      - name: Build desktop bundles
        run: pnpm --filter @onethu/desktop exec tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onethu-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/**/*.dmg
            apps/desktop/src-tauri/target/**/*.exe
