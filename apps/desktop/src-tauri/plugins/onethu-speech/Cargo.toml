[package]
name = "tauri-plugin-onethu-speech"
version = "0.1.0"
edition = "2021"
description = "OneTHU 灵动岛语音输入：Android SpeechRecognizer（实时部分转写，长按会话式）"
links = "tauri-plugin-onethu-speech"

[lib]
name = "tauri_plugin_onethu_speech"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
log = "0.4"
