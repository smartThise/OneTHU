[package]
name = "tauri-plugin-onethu-mobile"
version = "0.1.0"
edition = "2021"
description = "OneTHU Android 系统桥：文件转存系统「下载」（MediaStore）、intent:// 深链跳 App"
links = "tauri-plugin-onethu-mobile"

[lib]
name = "tauri_plugin_onethu_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
log = "0.4"
