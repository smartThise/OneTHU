[package]
name = "onethu"
version = "0.7.11"
description = "OneTHU — 清华万物，汇合于一体"
edition = "2021"

[lib]
name = "onethu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
encoding_rs = "0.8"
tauri = { version = "2", features = [] }
# 外链走系统浏览器：webview 内 window.open/<a target=_blank> 均无效
tauri-plugin-opener = "2"
tauri-plugin-onethu-calendar = { path = "plugins/onethu-calendar" }
# Rust 插件安装：系统文件对话框选 manifest.json（Tauri v2 的 webview File 无 .path）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 插件宿主：sidecar 进程 stdio 泵（tauri 2 同系 tokio 1.x，无版本冲突）
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "charset", "http2"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
# 已在依赖树中（reqwest 传递依赖 0.22.1），直连引用无新增下载
base64 = "0.22"
# OneTHU Harness 内嵌（移动端）：Rust 骨干核心直接编进 App（桌面端仍走 sidecar 进程）
onethu-harness-core = { path = "../../../plugins/OneTHU-Harness/core" }
tauri-plugin-geolocation = "2.3.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
