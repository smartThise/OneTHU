[package]
name = "onethu"
version = "0.7.6"
description = "OneTHU — 清华万物，汇合于一体"
edition = "2021"

[lib]
name = "onethu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8"
tauri = { version = "2", features = [] }
# 外链走系统浏览器：webview 内 window.open/<a target=_blank> 均无效
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "charset", "http2"] }
url = "2"
# 已在依赖树中（reqwest 传递依赖 0.22.1），直连引用无新增下载
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
