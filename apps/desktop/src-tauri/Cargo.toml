[package]
name = "onethu"
version = "0.7.11"
description = "OneTHU — 清华万物，汇合于一体"
edition = "2021"

[lib]
name = "onethu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8"
# image-png：set_app_icon 运行时解码 PNG 图标（Image::from_bytes）
tauri = { version = "2", features = ["image-png"] }
# 外链走系统浏览器：webview 内 window.open/<a target=_blank> 均无效
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "charset", "http2"] }
url = "2"
# 已在依赖树中（reqwest 传递依赖 0.22.1），直连引用无新增下载
base64 = "0.22"

# Android 换图标（set_app_icon）：JNI 调 PackageManager.setComponentEnabledSetting
# 注意：target 表必须放在 [dependencies] 全部条目之后，否则后续依赖会被吞进该表
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", features = ["invocation"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
