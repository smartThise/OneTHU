# 本机构建配置（已 gitignore，不入库）——勿删，删了构建就会回到 exFAT target/ 再次踩坑。
#
# 根因（2026-09-11 实锤）：本仓库在外置 exFAT 盘上，exFAT 不支持扩展属性，
# macOS 给每个构建产物写 com.apple.provenance xattr 时只能落成 ._* 伴生文件；
# tauri 的 build.rs 扫 permissions 目录时把 ._default.toml 当 TOML 读，
# "stream did not contain valid UTF-8" 直接 panic——依赖一变（cargo update）
# build.rs 重跑就必炸。内置 APFS 盘无此问题，target 指过去根治。
#
# 注意：内置盘余量有限，若空间紧张可删本目录（cargo 会全量重建）。
[build]
target-dir = "/Users/st/Library/Caches/onethu/cargo-target"
